# CivicConnect staging: Nginx site (DEC-003 v0.5, Edge row; DEC-015 §5; DEC-019)
#
# Installed on the staging VM as /etc/nginx/sites-enabled/civicconnect-staging.
# Nginx terminates TLS, serves the built client (client/dist) as static files and
# proxies only /api/ to Node, which listens on 127.0.0.1:3000 (PORT in the
# environment file). Express has no static route by design.
#
# Source: the staging deploy record, docs/evidence/M3_Staging_Deploy_v3.0-M3-rc.md
# (section 3a and the note of 15/10/2026, E. Lindsay). The live file was never
# captured in full, so lines marked NOT RECORDED are not taken from the record:
# compare this file with the VM before relying on it (deploy/README.md).
#
# No secret and no IP address is held here. The certificate and key are files
# on the VM; their paths are not secrets.

# Port 80: redirect everything to HTTPS (recorded: "http:// 301 -> https://<IP>/").
server {
    listen 80;
    # NOT RECORDED: the live server_name. "_" matches any host, which is what a
    # VM reached by IP address needs.
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # NOT RECORDED: the live server_name (see above).
    server_name _;

    # Self-signed certificate whose SAN is the VM's IP (deploy record section 3a,
    # generated with: openssl req -x509 ... -keyout /etc/ssl/private/staging.key
    # -out /etc/ssl/certs/staging.crt). The record states that these two lines
    # were not captured; the paths are the ones that command wrote.
    ssl_certificate     /etc/ssl/certs/staging.crt;
    ssl_certificate_key /etc/ssl/private/staging.key;
    # Recorded (note of 15/10/2026): pins NFR-3.2's TLS 1.2+ in this file.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Recorded (note of 15/10/2026): the client build, DEC-003 step 3.
    root /opt/civicconnect/client/dist;
    index index.html;

    # Recorded (note of 15/10/2026): only /api/ goes to Node, with the four
    # headers the earlier file already set. With no URI part on proxy_pass the
    # request path is passed unchanged, so /api/v1/health reaches /api/v1/health.
    # Express trusts X-Forwarded-Proto from loopback only (DEC-003 Edge row,
    # trust proxy = loopback), which makes the __Host-sid cookie Secure (DEC-018).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        # Recorded from the live VM (diff of 17/10/2026 22:57 UTC).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recorded (note of 15/10/2026): every other path is a client file, or the
    # client's index.html so that a deep link such as /requests/<id> loads the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not added here: HSTS. DEC-003's Edge row asks for it, but browsers ignore a
    # Strict-Transport-Security header from a host that is an IP address
    # (RFC 6797 §8.1), so it has no effect until staging has a domain name and a
    # Let's Encrypt certificate (DEC-003 v0.5). NOT RECORDED whether the live file
    # sets it.
}
