# CivicConnect — continuous integration (issue #52)
#
# Runs on every pull request into dev or main, and on every push to dev.
# Six jobs. Jobs 1-5 are required status checks on dev and main ("dev rule"
# ruleset, 2026-10-13), so any one failing blocks the merge; job 6 is not yet
# required (see below):
#   1. build-and-test — installs from the lockfile and runs the test suite on
#      the runtime in package.json "engines" (Node 22). Makes the
#      authorisation-guard route-table test (NFR-3.3, CON-019, DEC-012) a
#      build gate rather than a test someone might remember to run. Also
#      fails if a route or middleware file imports a model or repository
#      directly, by static, re-export, side-effect or dynamic import
#      (NFR-1.7, DEC-014, RSK-016).
#   2. secret-scan — scans the history of what this run would merge (HEAD) for
#      committed credentials, including the text inside Office documents
#      (NFR-3.5, Master Brief §9, CON-006). Every branch is scanned weekly by
#      secret-scan-all-branches.yml, which reports but does not block merges.
#   3. lint — ESLint, defect-catching rules only, fails on any error
#      (eslint.config.js). M3 §9 quality gate.
#   4. dependency-audit — npm audit of the server's and the client's
#      production dependencies, fails on a high or critical advisory.
#      M3 §9 quality gate.
#   5. codeql — CodeQL static security analysis of the JavaScript sources.
#      The required check is this job, which fails only if the analysis
#      itself fails. Alerts appear under Security > Code scanning and do
#      not block a merge: the separate "CodeQL" result is not required.
#   6. integration-tests — the eight API/integration cases (tests/integration)
#      against a throwaway single-node MongoDB 8.0 replica set started inside
#      the job, so transactions work and no cluster credential is held in CI
#      (TD-008). Not a required check when added, because it still fails on the
#      documented DEC-015 differences (DEF-007 to DEF-011). It is made required
#      once those are fixed and it passes.
# The build-and-test job also installs and builds the client (DEC-019).
# A mature CI/CD pipeline is not an M2 requirement; jobs 1-2 were stage 1 of
# the staged adoption recorded in the team's Assignment 2 research, jobs 3-5
# are the M3 stage, and job 6 repays TD-008 at M4.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (matches package.json engines)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Install the client's dependencies from its lockfile (DEC-019)
        run: npm --prefix client ci

      - name: Build the client (DEC-019; DEC-003 v0.3 step 3)
        run: npm run build:client

      - name: Run the test suite
        run: npm test

      # Matches `from '../models/…'` (import or re-export), a side-effect
      # `import '../models/…'` and a dynamic `import('../models/…')`, at any
      # depth of ../ and with or without a src/ segment. The re-export form is
      # proven in CI by GATE-01 (docs/evidence/M3-CI/). Not covered: a
      # cross-module collection read, which stays a reviewer responsibility
      # (PED §11.1).
      - name: Layer boundary check — presentation must not import data access (NFR-1.7, RSK-016)
        run: |
          # Fail closed: if either folder is missing, grep exits 2 and the
          # check would pass even with a breach in the other folder.
          for dir in src/routes src/middleware; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir not found, so the layer check has nothing to scan. Update its paths (issue #51)."
              exit 1
            fi
          done
          if grep -rnE "(from|import)[[:space:]]*\(?[[:space:]]*['\"](\.\./)+(src/)?(models|repositories)/" src/routes src/middleware; then
            echo "::error::A route or middleware file imports a model or repository directly. NFR-1.7 requires every dependency to cross exactly one layer boundary (PED §6A.5)."
            exit 1
          fi
          echo "No presentation-to-data-access imports found."

  # Not a candidate for a deliberate-failure demonstration. This job scans
  # history, so a seeded fake secret stays in the history after the revert and
  # would fail every later run until it was allowlisted or the history
  # rewritten. The M3 §9 demonstration uses the layer boundary check instead.
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scanned range: the history of HEAD, which on a pull request is the merge
      # result (dev plus this PR). Until 2026-10-13 this was --all, so the scan
      # also read every other branch: on PR #90 it failed on six hash lines that
      # existed only on #89's unmerged branch, whose .gitleaksignore was not on
      # dev, and every PR into dev was blocked by someone else's branch
      # (GATE-01). Other branches are scanned by secret-scan-all-branches.yml.
      # Gitleaks' "N commits scanned" is lower than git's commit count, and that
      # is expected: it does not scan binary file contents, so a commit whose
      # only changes are binary edits or deletions (e.g. an .xlsx-only register
      # update) contributes nothing to scan and is not counted. Reconciled on
      # 2026-10-12 by scanning each commit alone: exactly 8 commits are
      # uncounted, all of that kind.
      # Consequence: secrets inside binary files are not detected by this step.
      # The next two steps close that gap for Office documents.
      - name: Scan for committed secrets with Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose \
            --log-opts="HEAD --full-history"

      # An .xlsx/.docx/.pptx is a zip of XML, so every version of every Office
      # document in the history is unzipped and its text scanned. Proven on
      # 2026-10-12 with a fake token that existed only in an overwritten
      # workbook version: the step above missed it, these two found it.
      # Other binaries (images) are not text containers and are not covered.
      - name: Extract every committed version of every Office document
        run: scripts/ci/extract-office-documents.sh . "$RUNNER_TEMP/office-documents" HEAD

      - name: Scan the extracted Office document text with Gitleaks
        run: |
            cat "$RUNNER_TEMP/office-documents/MANIFEST.txt"
            docker run --rm -v "$RUNNER_TEMP/office-documents:/scan" \
            -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:v8.18.4 \
            detect --no-git --source /scan --redact --verbose \
            --gitleaks-ignore-path /repo

  lint:
    name: Static analysis (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (matches package.json engines)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (matches package.json engines)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Production dependencies only: they are what is deployed to the application host (DEC-003).
      # Dev tooling (ESLint) never ships, so an advisory there would block
      # merges without exposing the running system.
      # High, not moderate: moderate pulls in transitive advisories with no fix
      # path, and a gate that fails on what the team cannot fix gets ignored.
      - name: Audit production dependencies (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

      # react and react-dom ship to the browser from client/dist, so the
      # client's production dependencies are audited on the same terms.
      - name: Audit the client's production dependencies (high and critical fail the build)
        run: npm --prefix client audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # TD-008. The eight API/integration cases need a real MongoDB with
  # transactions, so they skip in build-and-test, which has no database. Here
  # they run against a single-node replica set started on the runner and thrown
  # away with it: no Atlas cluster, no IP allow-list, no secret. The harness
  # accepts this loopback host only when CI=true (tests/integration/_harness.js).
  integration-tests:
    name: Integration tests (MongoDB 8.0 replica set)
    runs-on: ubuntu-latest
    env:
      # directConnection: the single member is reached on the published port,
      # not by the address the replica set records for itself.
      MONGODB_URI: mongodb://127.0.0.1:27017/civicconnect?replicaSet=rs0&directConnection=true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (matches package.json engines)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      # A replica set is required: the unit of work uses a transaction
      # (DEC-016), and a standalone mongod refuses transactions.
      - name: Start a single-node MongoDB 8.0 replica set
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for i in $(seq 1 30); do
            if [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              echo "Replica set rs0 has a primary."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The replica set did not elect a primary within 60 s."
          exit 1

      # Fail closed: if the harness skipped the cases (no URI, or a host it does
      # not accept), node --test would exit 0 having verified nothing. The TAP
      # summary is checked so a skipped run fails the job.
      - name: Run the integration cases
        run: |
          set +e
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/integration.tap" \
            "tests/integration/*.test.js"
          status=$?
          set -e
          if ! grep -qx '# skipped 0' "$RUNNER_TEMP/integration.tap" || grep -qx '# tests 0' "$RUNNER_TEMP/integration.tap"; then
            echo "::error::Integration cases were skipped or none ran, so nothing was verified."
            exit 1
          fi
          exit $status
