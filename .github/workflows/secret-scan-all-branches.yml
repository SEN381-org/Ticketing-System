# CivicConnect — weekly secret scan of every branch (NFR-3.5)
#
# The required "Secret scan (full history)" check in ci.yml scans only the
# history of what a pull request would merge. That stops one person's unmerged
# branch from blocking everyone else's PRs (found on PR #90, GATE-01), but a
# secret pushed to any branch is still exposed on GitHub. This workflow covers
# that: it scans every branch, including the text inside Office documents, once
# a week and on demand. It is not a required check, so it reports without
# blocking merges. A red run here means: find the branch, rotate the secret.

name: Secret scan (all branches)

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan-all-branches:
    name: Secret scan (all branches)
    runs-on: ubuntu-latest
    steps:
      - name: Check out every branch's full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every branch with Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose \
            --log-opts="--all --full-history"

      - name: Extract every Office document version on every branch
        run: scripts/ci/extract-office-documents.sh . "$RUNNER_TEMP/office-documents" --all

      - name: Scan the extracted Office document text with Gitleaks
        run: |
          cat "$RUNNER_TEMP/office-documents/MANIFEST.txt"
          docker run --rm -v "$RUNNER_TEMP/office-documents:/scan" \
            -v "${{ github.workspace }}:/repo:ro" \
            zricethezav/gitleaks:v8.18.4 \
            detect --no-git --source /scan --redact --verbose \
            --gitleaks-ignore-path /repo