openapi: 3.1.0
info:
  title: CivicConnect API
  version: 0.2.0
  summary: Browser-to-backend contract for the CivicConnect request lifecycle.
  description: |
    Contract referenced by DEC-015 (API semantics) and DEC-018 (authentication and
    sessions). Version 0.2 (M3 Phase 0) adds the session resource and the health
    endpoint to the status transition from 0.1. It describes the code in
    `src/routes/`, `src/services/`, `src/middleware/` and `src/errors.js`.

    The remaining DEC-015 endpoints are not listed here, because they are not yet
    implemented: submission, read, list, search, assignments, comments, history
    and notifications. Each is added when its route exists, so this file never
    describes an endpoint the application does not serve.

    Every write must be sent as `application/json` (415 otherwise) and is capped
    at 32 kB (413). With SameSite=Lax this is the CSRF mitigation DEC-015 §5
    records. Unauthenticated routes are exactly those listed in
    `src/routes/publicRoutes.js`, each with its reason.

    Traces to: FR-1.1, FR-1.3, FR-1.4, FR-6.2 to FR-6.6, NFR-1.4, NFR-1.6, NFR-3.3,
    NFR-3.4, CON-019, DEC-012, DEC-015, DEC-016, DEC-018.
servers:
  - url: /api/v1
    description: Versioned base path (DEC-015). Breaking changes go to /api/v2.
tags:
  - name: requests
    description: Service request lifecycle
  - name: sessions
    description: Authentication (DEC-018)
  - name: notifications
    description: In-application notifications (FR-3.4)
  - name: operations
    description: Health (NFR-1.6)
security:
  - session: []
paths:
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Application and data-store availability
      description: |
        Public (NFR-1.6: "without requiring a user account"). Issues a database
        `ping` only, bounded to 3 seconds. It reads no collection and no personal
        data. Used by the DEC-003 deploy script after a restart.
      security: []
      responses:
        '200':
          description: The application is up and the database answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { application: up, database: up, release: 0867575a1b2c3d4e5f60718293a4b5c6d7e8f901 }
        '503':
          description: The application is up and the database did not answer (DEC-015).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { application: up, database: down, release: 0867575a1b2c3d4e5f60718293a4b5c6d7e8f901 }
  /sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Log in
      description: |
        Public: logging in cannot require being logged in (FR-1.1). On success,
        sets the `__Host-sid` cookie and issues a new session identifier every
        time (no fixation). Every failure (unknown email, wrong password, revoked
        account) returns one identical 401, and an unknown email still costs a
        password hash, so neither the response nor its timing reveals which
        accounts exist (DEC-018 §5). Every attempt is recorded in `auditLog`
        (NFR-1.4); the submitted email never is.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCommand' }
      responses:
        '201':
          description: Logged in.
          headers:
            Set-Cookie:
              description: '__Host-sid=<opaque>; Path=/; HttpOnly; Secure; SameSite=Lax'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Body is not a JSON object with exactly the string fields email and password, or is not valid JSON (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: The credentials were not accepted (UNAUTHENTICATED). Identical for every cause.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Not sent as application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /sessions/current:
    delete:
      tags: [sessions]
      operationId: deleteCurrentSession
      summary: Log out
      description: |
        Public and idempotent (DEC-018 §5). Ends the session named by the
        caller's cookie, if there is one, and always clears the cookie. It never
        reveals whether a session existed. A logout is recorded in `auditLog`
        only when a session was actually ended.
      security: []
      responses:
        '204':
          description: No session remains for this cookie.
  /requests/{id}:
    get:
      tags: [requests]
      operationId: getRequest
      summary: Read a request
      description: |
        Provisional: FR-4.2 is Proposed and not yet baselined (OI-01), so this
        operation may change when the requirement is confirmed.

        Returns only `reference`, `status` and `version`; the `ETag` header
        carries the same version in the form accepted by `If-Match` on the
        transition resource. `status` is the status this caller may be shown:
        a Requester sees only Received, In Progress or Closed for a
        security-category request (FR-3.5, DEC-012 enforcement point 3).

        A Requester asking for a request that is not theirs receives the same 404
        as for an identifier that does not exist (FR-3.6, DEC-015 §4). A staff
        member who may not view the request receives 403 (DEC-015 does not
        specify this case; 403 is consistent with the service layer, and 404 may
        be revisited when security categories land).
      parameters:
        - name: id
          in: path
          required: true
          description: Request identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: The request, as this caller may see it.
          headers:
            ETag:
              description: The current version, e.g. "v4".
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestView' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not read requests, or the staff member may not view this request (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such request, or a Requester asking for another user's request (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/transitions:
    post:
      tags: [requests]
      operationId: transitionRequest
      summary: Move a request to a new status
      description: |
        A status change is modelled as a sub-resource, not as a PATCH of a status
        field (DEC-015, review comment R-03). The transition and its immutable
        history entry are written in one unit of work (DEC-016). Allowed moves,
        and the roles that may make them, follow the transition model in
        `src/domain/requestStatus.js`, which is a design proposal pending
        confirmation under OI-15.

        Authorisation is checked in two places. The route guard checks the role
        (`request:transition`, FR-1.3). The service then checks object-level
        access and category authorisation (DEC-012). Only a Security Officer may
        act on a security-category request (FR-1.5 and CFL-002, recorded under
        OI-15).
      parameters:
        - name: id
          in: path
          required: true
          description: Request identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: If-Match
          in: header
          required: true
          description: |
            Strong ETag of the version the client last read, in the form "v<n>".
            If it is missing or malformed the response is 428; if it is stale
            the response is 412 (optimistic concurrency, DEC-015 §2 and DEC-016).
          schema:
            type: string
            pattern: '^"v[0-9]+"$'
          example: '"v3"'
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            A key generated per logical user action and reused unchanged on every
            retry of that action (UUID v4 recommended). A missing or blank key
            returns 400. A key reused with a different request body returns 422.
            A replayed key with the same body returns the original result with
            200 and writes nothing (DEC-015 §3).
          schema:
            type: string
            minLength: 1
          example: 3f0c9a1e-2b7d-4c55-9a51-0d8e7c1b2f64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionCommand'
            examples:
              resolve:
                summary: Resolve with resolution information (FR-6.5)
                value: { toStatus: Resolved, resolution: Replaced the faulty breaker in block C }
              close:
                summary: Close with a recorded reason (FR-6.6)
                value: { toStatus: Closed, reason: Confirmed fixed with the requester }
      responses:
        '201':
          description: Transition committed; one history entry written.
          headers:
            ETag:
              description: The new version, e.g. "v4".
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '200':
          description: Idempotent replay of a previously committed transition. Nothing is written.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionReplay'
        '400':
          description: Idempotency-Key missing or blank (IDEMPOTENCY_KEY_REQUIRED), or the body is not valid JSON (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            The role may not perform the operation (route guard), or the actor may
            not act on this request (category authorisation, or a security-category
            request without the Security Officer role) (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Request not found (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412':
          description: If-Match does not match the current version (PRECONDITION_FAILED). Re-read and retry deliberately.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            One of the following:
            - a transition the model does not allow;
            - a role that may not make this move;
            - no resolution before Resolved (FR-6.5);
            - no reason for Closed or Rejected (FR-6.6).
            These return INVALID_TRANSITION. An Idempotency-Key reused with a
            different body returns IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body over 32 kB (PAYLOAD_TOO_LARGE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Not sent as application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '428':
          description: If-Match missing or malformed (PRECONDITION_REQUIRED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Unexpected error. The body is generic; the detail is logged, never sent (R-05, CON-019).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/history:
    get:
      tags: [requests]
      operationId: getRequestHistory
      summary: List a request's history, oldest first
      description: |
        The immutable record of a request (DB-01): created, status, assignment,
        comment, action, detail and resolution entries, in ascending
        `requestVersion` (FR-3.3, FR-7.4). Each entry carries the acting user,
        the role and the date-time (FR-7.3, NFR-3.6). A status entry carries its
        `reason` (FR-6.6); the status entry that resolved the request carries the
        `resolution` recorded with it (FR-6.5, FR-7.5); an assignment entry
        carries `fromAssigneeId` and `toAssigneeId` (FR-5.4).

        Authorised exactly as GET /requests/{id}: staff see every entry; a
        Requester sees created, status and detail entries of their own request,
        with the staff user's identifier withheld. On a security-category request
        a Requester receives no body or reason at all and only the statuses
        FR-3.5 permits (FR-1.5). Staff without the Security Officer role receive
        403 for a security-category request (AC-NFR-4.4). Which entry types a
        Requester may see is not stated in DB-01 or DEC-012; the narrower reading
        is implemented and recorded as an open question.

        There is no operation that alters or deletes an entry (FR-6.7).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The history this caller may see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestHistory' }
        '400':
          description: The identifier is malformed (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The role may not read requests, or the staff member may not view this request (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such request, or a Requester asking for another user's request (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/comments:
    post:
      tags: [requests]
      operationId: addComment
      summary: Add a comment to a request
      description: |
        FR-7.1. Operation `request:comment` (Technician, Coordinator, Manager,
        Security Officer), and the actor must be authorised for the request's
        category; only a Security Officer may act on a security-category request.
        The comment is a history entry that produces the next request version
        (DB-01), written in one unit of work with that version change (DEC-016).
        `If-Match` is not required (DEC-015 §1); `Idempotency-Key` is. The
        `ETag` of the response is the new version.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCommand' }
      responses:
        '201': { $ref: '#/components/responses/EntryCreated' }
        '200': { $ref: '#/components/responses/EntryReplayed' }
        '400': { $ref: '#/components/responses/EntryInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EntryForbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/EntryConflict' }
        '422': { $ref: '#/components/responses/EntryKeyReused' }
  /requests/{id}/actions:
    post:
      tags: [requests]
      operationId: addAction
      summary: Record an action taken on a request
      description: |
        FR-7.2. Same operation, authorisation, versioning and idempotency as
        `POST /requests/{id}/comments`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCommand' }
      responses:
        '201': { $ref: '#/components/responses/EntryCreated' }
        '200': { $ref: '#/components/responses/EntryReplayed' }
        '400': { $ref: '#/components/responses/EntryInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EntryForbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/EntryConflict' }
        '422': { $ref: '#/components/responses/EntryKeyReused' }
  /requests/{id}/details:
    post:
      tags: [requests]
      operationId: addDetail
      summary: Add optional detail to a request
      description: |
        FR-2.4. Operation `request:add-detail` (Requester). Only the requester who
        owns the request may add detail; another Requester receives the 404 of a
        missing identifier (FR-3.6). The detail is stored with the date, time and
        acting user. Versioning and idempotency are as for comments.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCommand' }
      responses:
        '201': { $ref: '#/components/responses/EntryCreated' }
        '200': { $ref: '#/components/responses/EntryReplayed' }
        '400': { $ref: '#/components/responses/EntryInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EntryForbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/EntryConflict' }
        '422': { $ref: '#/components/responses/EntryKeyReused' }
  /me/notifications:
    get:
      tags: [notifications]
      operationId: listMyNotifications
      summary: The caller's own in-application notifications, newest first
      description: |
        FR-3.4. Written after a status change commits (DEC-011), read from the
        store, so a notification is available on the requester's next session.
        The recipient is always the authenticated user. A notification identifies
        the request by reference and the kind of change; `displayStatus` is the
        status the recipient may be shown (FR-3.5), and no description, comment,
        action or reason is carried (FR-1.5). At most 50 are returned; they are
        deleted 30 days after creation (DEC-017).
      responses:
        '200':
          description: The caller's notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: |
        The session establishes `req.actor` server-side (DEC-018). Identity is
        never taken from a header, query parameter or request body (review
        comment R-06); an identity-shaped header is refused with 403. The value
        is opaque; only its SHA-256 is stored. A session is refused once 30
        minutes have elapsed since its recorded last activity, which is refreshed
        at most once per 60 seconds, so it expires between 29 and 30 minutes
        after the last request (NFR-3.4).
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: Request identifier (MongoDB ObjectId).
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key generated per logical user action and reused unchanged on every
        retry (UUID v4 recommended, at most 64 characters). Missing or blank
        returns 400. Reused with a different body returns 422. Reused with the
        same body returns the original result with 200, header
        `Idempotent-Replayed: true`, and writes nothing (DEC-015 §3).
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Unauthenticated:
      description: No authenticated actor (UNAUTHENTICATED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryCreated:
      description: The entry was appended; the request is at the new version.
      headers:
        ETag:
          description: The new version, e.g. "v4".
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EntryResult' }
    EntryReplayed:
      description: Idempotent replay of an entry already appended. Nothing is written.
      headers:
        Idempotent-Replayed:
          schema: { type: string, enum: ['true'] }
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EntryReplay' }
    EntryInvalid:
      description: |
        Idempotency-Key missing (IDEMPOTENCY_KEY_REQUIRED); or the identifier,
        the key length or the body is invalid: `body` missing, blank, over 5000
        characters, or an unknown field (INVALID_REQUEST).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryForbidden:
      description: |
        The role may not perform the operation (route guard), or the actor may
        not act on this request: not authorised for its category, or a
        security-category request without the Security Officer role (FORBIDDEN).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryNotFound:
      description: No such request, or a Requester naming another user's request (NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryConflict:
      description: Another write kept changing the request; retries were exhausted (WRITE_CONFLICT). Retry the action.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryKeyReused:
      description: The Idempotency-Key was used with a different body (IDEMPOTENCY_CONFLICT).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      required: [application, database, release]
      properties:
        application: { type: string, enum: [up] }
        database: { type: string, enum: [up, down] }
        release:
          type: string
          description: The commit the running process was started from (RELEASE_COMMIT, else the checkout's HEAD), or `unknown`.
          pattern: '^([0-9a-f]{7,40}|unknown)$'
    LoginCommand:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, format: password }
    SessionUser:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string }
        displayName: { type: string }
        roles:
          type: array
          minItems: 1
          items:
            type: string
            description: The controlled role set (FR-1.2).
            enum: [Requester, Technician, Coordinator, Manager, Security Officer, Administrator]
    Status:
      type: string
      description: The controlled status set (FR-6.1).
      enum: [Received, Assigned, In Progress, On Hold, Resolved, Closed, Rejected]
    RequestView:
      type: object
      additionalProperties: false
      required: [reference, status, version]
      properties:
        reference: { type: string, pattern: '^CC-\d{4}-\d{6}$' }
        status: { $ref: '#/components/schemas/Status' }
        version: { type: integer, minimum: 0, description: The current version; also returned as the ETag. }
    TransitionCommand:
      type: object
      required: [toStatus]
      properties:
        toStatus:
          $ref: '#/components/schemas/Status'
        reason:
          type: string
          maxLength: 1000
          description: Required when toStatus is Closed or Rejected (FR-6.6). Recorded as closure.reason and as the history entry body.
        resolution:
          type: string
          maxLength: 2000
          description: Resolution information for In Progress → Resolved (FR-6.5). Recorded as resolution.summary.
    TransitionResult:
      type: object
      required: [requestId, fromStatus, toStatus, occurredAt, version, historyId]
      properties:
        requestId: { type: string }
        fromStatus: { $ref: '#/components/schemas/Status' }
        toStatus: { $ref: '#/components/schemas/Status' }
        occurredAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: The new version; also returned as the ETag. }
        historyId: { type: string, description: The requestHistory entry written (FR-6.3). }
        reporterId: { type: string }
        categoryId: { type: string }
        campusId: { type: string }
        reference: { type: string, pattern: '^CC-\d{4}-\d{6}$' }
        securityCategory: { type: boolean }
    TransitionReplay:
      type: object
      required: [requestId, fromStatus, toStatus, occurredAt, version, historyId, replayed]
      properties:
        requestId: { type: string }
        fromStatus: { $ref: '#/components/schemas/Status' }
        toStatus: { $ref: '#/components/schemas/Status' }
        occurredAt: { type: string, format: date-time }
        version: { type: integer }
        historyId: { type: string }
        replayed: { type: boolean, const: true }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [IDEMPOTENCY_KEY_REQUIRED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, PRECONDITION_FAILED,
                 INVALID_TRANSITION, IDEMPOTENCY_CONFLICT, PRECONDITION_REQUIRED, INVALID_REQUEST,
                 UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE, WRITE_CONFLICT, INTERNAL_ERROR]
        instance: { type: string }
    EntryCommand:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000, description: The comment, action or detail text. }
    EntryResult:
      type: object
      required: [requestId, historyId, changeType, requestVersion, occurredAt, version]
      properties:
        requestId: { type: string }
        historyId: { type: string }
        changeType: { type: string, enum: [comment, action, detail] }
        requestVersion: { type: integer, minimum: 1, description: The request version this entry produced (DB-01). }
        occurredAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: The new request version; also returned as the ETag. }
    EntryReplay:
      allOf:
        - $ref: '#/components/schemas/EntryResult'
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean, const: true }
    HistoryEntry:
      type: object
      required: [id, requestVersion, changeType, occurredAt, actorRole, actorId]
      properties:
        id: { type: string }
        requestVersion: { type: integer, minimum: 1 }
        changeType: { type: string, enum: [created, status, assignment, comment, action, detail, resolution] }
        occurredAt: { type: string, format: date-time }
        actorId: { type: [string, 'null'], description: The acting user; withheld (null) from a Requester for entries made by staff. }
        actorRole: { type: string, description: The role the actor held when acting (FR-1.2). }
        fromStatus: { type: [string, 'null'], description: Present on created and status entries. A Requester sees FR-3.5 mapped values on a security-category request. }
        toStatus: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: On a status entry (FR-6.6). Never sent to a Requester for a security-category request. }
        resolution: { type: [string, 'null'], description: On the status entry that resolved the request (FR-6.5, FR-7.5). Staff only. }
        fromAssigneeId: { type: [string, 'null'], description: On an assignment entry (FR-5.4). Staff only. }
        toAssigneeId: { type: [string, 'null'] }
        body: { type: [string, 'null'], description: On comment, action, detail and resolution entries. Comment, action and resolution entries are staff only; a detail body is never sent to a Requester for a security-category request. }
    RequestHistory:
      type: object
      required: [requestId, entries]
      properties:
        requestId: { type: string }
        entries:
          type: array
          description: Ascending requestVersion.
          items: { $ref: '#/components/schemas/HistoryEntry' }
    Notification:
      type: object
      additionalProperties: false
      required: [id, requestId, requestReference, kind, displayStatus, read, createdAt]
      properties:
        id: { type: string }
        requestId: { type: string }
        requestReference: { type: string, pattern: '^CC-\d{4}-\d{6}$' }
        kind: { type: string, enum: [accepted, rejected, updated, completed] }
        displayStatus: { $ref: '#/components/schemas/Status' }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
