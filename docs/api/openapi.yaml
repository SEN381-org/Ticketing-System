openapi: 3.1.0
info:
  title: CivicConnect API
  version: 0.2.0
  summary: Browser-to-backend contract for the CivicConnect request lifecycle.
  description: |
    Contract referenced by DEC-015 (API semantics) and DEC-018 (authentication and
    sessions). Version 0.2 (M3 Phase 0) adds the session resource and the health
    endpoint to the status transition from 0.1. It describes the code in
    `src/routes/`, `src/services/`, `src/middleware/` and `src/errors.js`.

    The remaining DEC-015 endpoints are not listed here, because they are not yet
    implemented: submission, read, list, search, assignments, comments, history
    and notifications. Each is added when its route exists, so this file never
    describes an endpoint the application does not serve.

    Every write must be sent as `application/json` (415 otherwise) and is capped
    at 32 kB (413). With SameSite=Lax this is the CSRF mitigation DEC-015 §5
    records. Unauthenticated routes are exactly those listed in
    `src/routes/publicRoutes.js`, each with its reason.

    Traces to: FR-1.1, FR-1.3, FR-1.4, FR-6.2 to FR-6.6, NFR-1.4, NFR-1.6, NFR-3.3,
    NFR-3.4, CON-019, DEC-012, DEC-015, DEC-016, DEC-018.
servers:
  - url: /api/v1
    description: Versioned base path (DEC-015). Breaking changes go to /api/v2.
tags:
  - name: requests
    description: Service request lifecycle
  - name: sessions
    description: Authentication (DEC-018)
  - name: operations
    description: Health (NFR-1.6)
  - name: notifications
    description: In-application notifications (FR-3.4)
  - name: users
    description: User administration (DEC-015 Addendum A)
  - name: reports
    description: Management view (DEC-015 Addendum A)
  - name: categories
    description: Category administration (DEC-015 Addendum A)
security:
  - session: []
paths:
  /health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Application and data-store availability
      description: |
        Public (NFR-1.6: "without requiring a user account"). Issues a database
        `ping` only, bounded to 3 seconds. It reads no collection and no personal
        data. Used by the DEC-003 deploy script after a restart.
      security: []
      responses:
        '200':
          description: The application is up and the database answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { application: up, database: up, release: 0867575a1b2c3d4e5f60718293a4b5c6d7e8f901 }
        '503':
          description: The application is up and the database did not answer (DEC-015).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { application: up, database: down, release: 0867575a1b2c3d4e5f60718293a4b5c6d7e8f901 }
  /sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Log in
      description: |
        Public: logging in cannot require being logged in (FR-1.1). On success,
        sets the `__Host-sid` cookie and issues a new session identifier every
        time (no fixation). Every failure (unknown email, wrong password, revoked
        account) returns one identical 401, and an unknown email still costs a
        password hash, so neither the response nor its timing reveals which
        accounts exist (DEC-018 §5). Every attempt is recorded in `auditLog`
        (NFR-1.4); the submitted email never is.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCommand' }
      responses:
        '201':
          description: Logged in.
          headers:
            Set-Cookie:
              description: '__Host-sid=<opaque>; Path=/; HttpOnly; Secure; SameSite=Lax'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Body is not a JSON object with exactly the string fields email and password, or is not valid JSON (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: The credentials were not accepted (UNAUTHENTICATED). Identical for every cause.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Not sent as application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /sessions/current:
    delete:
      tags: [sessions]
      operationId: deleteCurrentSession
      summary: Log out
      description: |
        Public and idempotent (DEC-018 §5). Ends the session named by the
        caller's cookie, if there is one, and always clears the cookie. It never
        reveals whether a session existed. A logout is recorded in `auditLog`
        only when a session was actually ended.
      security: []
      responses:
        '204':
          description: No session remains for this cookie.
  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: List the requests the caller may view
      description: |
        A Requester receives their own requests only (FR-3.1, FR-3.6), with the
        status they are shown (FR-3.5). Staff receive the requests their role and
        category authorisation permit (FR-4.1); a security-category request is
        listed only for a Security Officer (FR-1.5, OI-15). The set is the one
        `mayViewRequest` permits (DEC-012 enforcement point 2). An actor holding
        no viewing role receives an empty list. Cursor pagination, newest first
        by default. An item never carries a description, comment or action.
      parameters:
        - name: status
          in: query
          required: false
          description: Only requests in this status (FR-4.4). A Requester filters by the status they are shown (FR-3.5).
          schema: { $ref: '#/components/schemas/Status' }
        - name: categoryId
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
        - name: assigneeId
          in: query
          required: false
          description: |
            An assignee identifier, or the value `none` for the unassigned set
            (FR-4.6). `none` is a proposed convention: DEC-015 section 1 names the
            parameter but not this value, and it awaits the project lead's confirmation.
          schema: { type: string, pattern: '^([0-9a-fA-F]{24}|none)$' }
        - name: from
          in: query
          required: false
          description: Submitted on or after this ISO 8601 date or date-time.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Submitted on or before this ISO 8601 date-time; a date alone includes that whole UTC day.
          schema: { type: string }
        - name: sort
          in: query
          required: false
          description: |
            Default `-submittedAt` (newest first, FR-4.5). A leading `-` is
            descending. A Requester may order by `submittedAt` only.
          schema:
            type: string
            enum: [-submittedAt, submittedAt, status, -status, categoryId, -categoryId]
            default: -submittedAt
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page, for the same sort. Opaque.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: One page of the list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPage' }
        '400':
          description: A parameter is malformed, unknown or out of range; the detail names it (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor; no request data is returned (UNAUTHENTICATED, AC-FR-1.1).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [requests]
      operationId: submitRequest
      summary: Submit a request
      description: |
        FR-2.1. Exactly three fields are mandatory and nothing else is accepted
        (FR-2.2): `categoryId`, `location` and `description`. A missing or empty
        field returns 400 naming it (AC-FR-2.2b); an unknown field returns 400
        naming it (DEC-015 §5). `categoryId` must be a well-formed identifier of an
        active category of the caller's campus. A well-formed identifier that is
        unknown, deactivated or of another campus returns 422 and nothing is stored
        (AC-FR-2.3, FR-9.1).

        The request, its reference and its `created` history entry are written in one
        unit of work (DEC-016). The reference is unique and never changes
        (AC-FR-2.6). The submitting user, date and time are stored with it (AC-FR-2.5).

        A replayed Idempotency-Key with the same body returns the original status
        and body with `Idempotent-Replayed: true` and writes nothing (DEC-015 §3).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            A key created per logical user action and reused unchanged on every
            retry of that action (UUID v4 recommended). At most 64 characters.
            Missing or blank returns 400. Reused with a different body returns 422.
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: 3f0c9a1e-2b7d-4c55-9a51-0d8e7c1b2f64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCommand'
      responses:
        '201':
          description: Request stored, or an idempotent replay of the original (then with Idempotent-Replayed true).
          headers:
            Location:
              description: The new request, /api/v1/requests/{id}.
              schema: { type: string }
            ETag:
              description: The version, "v1".
              schema: { type: string }
            Idempotent-Replayed:
              description: Present, with the value true, only on a replay.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionResult' }
        '400':
          description: Idempotency-Key missing, blank or over 64 characters; a mandatory field missing or empty; an unknown field; a malformed categoryId; or the body is not valid JSON (IDEMPOTENCY_KEY_REQUIRED, INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not submit requests (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body over 32 kB (PAYLOAD_TOO_LARGE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Not sent as application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The category is not in the active list of the caller's campus
            (CATEGORY_NOT_SELECTABLE), or the Idempotency-Key was used with a
            different body (IDEMPOTENCY_CONFLICT).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Unexpected error. The body is generic; the detail is logged, never sent (R-05, CON-019).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /categories:
    get:
      tags: [requests]
      operationId: listCategories
      summary: List the active categories
      description: |
        DEC-015 Addendum A1. The active categories of the caller's campus, for the
        submission form (FR-2.3). A deactivated category is not listed (FR-9.1).
        Every FR-1.2 role may call it.
      responses:
        '200':
          description: The active categories, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Unexpected error. The body is generic; the detail is logged, never sent (R-05, CON-019).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}:
    get:
      tags: [requests]
      operationId: getRequest
      summary: Read a request
      description: |
        Provisional: FR-4.2 is Proposed and not yet baselined (OI-01), so this
        operation may change when the requirement is confirmed.

        Returns the request detail (FR-4.2, AC-FR-4.2, AC-FR-7.5; additive, DEC-015
        §6). Comments, actions and history are not embedded: read
        `GET /requests/{id}/history`. Who may read is unchanged. The `ETag`
        header carries the version in the form accepted by `If-Match` on the
        transition resource. `status` is the status this caller may be shown:
        a Requester sees only Received, In Progress or Closed for a
        security-category request (FR-3.5, DEC-012 enforcement point 3).

        Conditional members are absent, not null, when withheld. `description`,
        `resolution` and `closureReason` are returned on a security-category
        request only to a Security Officer (FR-1.5, read literally: a Requester
        on their own security request does not receive them, OI-16 open), and to
        every permitted viewer otherwise. `requesterId` and `submittedById`
        are returned to staff only. `permittedTransitions` lists the moves this
        caller may attempt now (TD-003); it is empty for a Requester.

        A Requester asking for a request that is not theirs receives the same 404
        as for an identifier that does not exist (FR-3.6, DEC-015 §4). A staff
        member who may not view the request receives 403 (DEC-015 does not
        specify this case; 403 is consistent with the service layer, and 404 may
        be revisited when security categories land).
      parameters:
        - name: id
          in: path
          required: true
          description: Request identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: The request, as this caller may see it.
          headers:
            ETag:
              description: The current version, e.g. "v4".
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestView' }
        '400':
          description: The id is not a valid identifier (INVALID_REQUEST, DEF-012).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not read requests, or the staff member may not view this request (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such request, or a Requester asking for another user's request (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/search:
    post:
      tags: [requests]
      operationId: searchRequests
      summary: Search the requests the caller may view
      description: |
        Staff only (FR-4.3). The route guard is `request:read`; a caller with no
        staff role is refused in the service. A POST so the search text never
        appears in a URL or a log (DEC-015 section 1, CON-007); the text is never logged.
        Matches a reference exactly, or the declared text index over description
        and location. The same authorisation filter, filters, sort and
        pagination as the list apply, and the result never carries a description.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchCommand' }
      responses:
        '200':
          description: One page of matches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPage' }
        '400':
          description: text missing or too long, or another field malformed or unknown; the detail names it (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The caller holds no staff role (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/transitions:
    post:
      tags: [requests]
      operationId: transitionRequest
      summary: Move a request to a new status
      description: |
        A status change is modelled as a sub-resource, not as a PATCH of a status
        field (DEC-015, review comment R-03). The transition and its immutable
        history entry are written in one unit of work (DEC-016). Allowed moves,
        and the roles that may make them, follow the transition model in
        `src/domain/requestStatus.js`, which is a design proposal pending
        confirmation under OI-15.

        Authorisation is checked in two places. The route guard checks the role
        (`request:transition`, FR-1.3). The service then checks object-level
        access and category authorisation (DEC-012). Only a Security Officer may
        act on a security-category request (FR-1.5 and CFL-002, recorded under
        OI-15).
      parameters:
        - name: id
          in: path
          required: true
          description: Request identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: If-Match
          in: header
          required: true
          description: |
            Strong ETag of the version the client last read, in the form "v<n>".
            If it is missing or malformed the response is 428; if it is stale
            the response is 412 (optimistic concurrency, DEC-015 §2 and DEC-016).
          schema:
            type: string
            pattern: '^"v[0-9]+"$'
          example: '"v3"'
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            A key generated per logical user action and reused unchanged on every
            retry of that action (UUID v4 recommended). A missing or blank key
            returns 400. A key reused with a different request body returns 422.
            A replayed key with the same request returns the original status code
            and body, with the header Idempotent-Replayed: true, and writes nothing
            (DEC-015 §3, DEF-007). The fingerprint covers the method, the path and the
            canonical JSON body, so a key reused on another request is refused (DEF-009).
          schema:
            type: string
            minLength: 1
          example: 3f0c9a1e-2b7d-4c55-9a51-0d8e7c1b2f64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionCommand'
            examples:
              resolve:
                summary: Resolve with resolution information (FR-6.5)
                value: { toStatus: Resolved, resolution: Replaced the faulty breaker in block C }
              close:
                summary: Close with a recorded reason (FR-6.6)
                value: { toStatus: Closed, reason: Confirmed fixed with the requester }
      responses:
        '201':
          description: |
            Transition committed; one history entry written. An idempotent replay of a
            committed transition returns the same status and body, writes nothing, and
            carries Idempotent-Replayed: true (DEC-015 §3, DEF-007).
          headers:
            ETag:
              description: The new version, e.g. "v4".
              schema: { type: string }
            Idempotent-Replayed:
              description: Present, with the value true, only on a replay.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '400':
          description: Idempotency-Key missing or blank (IDEMPOTENCY_KEY_REQUIRED), the body is not valid JSON, or the id is not a valid identifier (INVALID_REQUEST, DEF-012).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            The role may not perform the operation (route guard), the actor may not
            act on this request (category authorisation, or a security-category
            request without the Security Officer role), or no held role may make this
            move (DEF-011) (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Request not found (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412':
          description: |
            If-Match does not match the current version (PRECONDITION_FAILED). The body
            carries the current ETag as currentEtag where it is known (DEC-015 §2, DEF-008).
            Re-read and retry deliberately.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            One of the following:
            - a transition the model does not allow;
            - no resolution before Resolved (FR-6.5);
            - no reason for Closed or Rejected (FR-6.6).
            These return INVALID_TRANSITION. A role that may not make this move is
            403 FORBIDDEN, not 422 (DEC-015 §4, DEF-011). An Idempotency-Key reused
            with a different request returns IDEMPOTENCY_CONFLICT, problem type
            idempotency-key-reused (DEF-010).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body over 32 kB (PAYLOAD_TOO_LARGE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Not sent as application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '428':
          description: If-Match missing or malformed (PRECONDITION_REQUIRED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Unexpected error. The body is generic; the detail is logged, never sent (R-05, CON-019).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/assignments:
    post:
      tags: [requests]
      operationId: assignRequest
      summary: Assign, accept or reassign a request
      description: |
        One resource, one body (DEC-015 §1). What the body amounts to depends on
        who is acting and who is named:

        - **accept** (FR-5.2, FR-5.3): the actor names themselves and may perform
          `request:accept` (Technician, Security Officer). Refused with 422 if the
          request already has an owner; the owner is unchanged.
        - **assign** (FR-5.1): an actor who may perform `request:assign`
          (Coordinator, Manager) names a Technician or Security Officer, for a request with no owner.
          The request moves Received to Assigned.
        - **reassign** (FR-5.5): the same, for a request that already has an owner.
          The status is unchanged and the previous owner stays in the history
          entry (`fromAssigneeId`).

        The request update and its `assignment` history entry, carrying the acting
        user, date and time (FR-5.4), are written in one unit of work (DEC-016).
        The named user must be a Technician or Security Officer (a Coordinator or
        Manager is never an owner) authorised for the request's category, and a
        Security Officer for a security-category request (DEC-012).

        Every refused attempt (403 from the guard or the service, 422 from the
        domain rules) is recorded in the audit log with the actor, role(s),
        operation, target request and time (FR-1.3, AC-FR-1.3, AC-FR-5.3).
      parameters:
        - name: id
          in: path
          required: true
          description: Request identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: If-Match
          in: header
          required: true
          description: Strong ETag of the version the client last read, in the form "v<n>". Missing or malformed is 428; stale is 412.
          schema:
            type: string
            pattern: '^"v[0-9]+"$'
          example: '"v1"'
        - name: Idempotency-Key
          in: header
          required: true
          description: A key per logical user action, reused on every retry. Missing or blank is 400. A replay with the same body returns the original status and body with the header Idempotent-Replayed (true) and writes nothing (DEC-015 §3).
          schema:
            type: string
            minLength: 1
          example: 3f0c9a1e-2b7d-4c55-9a51-0d8e7c1b2f64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCommand'
      responses:
        '201':
          description: Assignment committed; one history entry written. A replay returns this status and body with Idempotent-Replayed true.
          headers:
            ETag:
              description: The new version, e.g. "v2".
              schema: { type: string }
            Idempotent-Replayed:
              description: Present, with the value true, only on a replay.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResult'
        '400':
          description: Idempotency-Key missing or blank (IDEMPOTENCY_KEY_REQUIRED), or the id, the body or the assigneeId is malformed (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform the operation (guard), or the actor may not act on this request (category authorisation, security-category request without the Security Officer role), or names someone else without holding request:assign (FORBIDDEN). The attempt is recorded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Request not found (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412':
          description: If-Match does not match the current version (PRECONDITION_FAILED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body over 32 kB (PAYLOAD_TOO_LARGE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Not sent as application/json (UNSUPPORTED_MEDIA_TYPE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The domain refused the assignment (ASSIGNMENT_REFUSED): the request already has an owner and the actor tried to accept it (FR-5.3), the named user cannot be assigned it, the named user already owns it, or the request is closed or rejected. An Idempotency-Key reused with a different body returns IDEMPOTENCY_CONFLICT. The attempt is recorded.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '428':
          description: If-Match missing or malformed (PRECONDITION_REQUIRED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500':
          description: Unexpected error. The body is generic; the detail is logged, never sent.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/history:
    get:
      tags: [requests]
      operationId: getRequestHistory
      summary: List a request's history, oldest first
      description: |
        The immutable record of a request (DB-01): created, status, assignment,
        comment, action, detail and resolution entries, in ascending
        `requestVersion` (FR-3.3, FR-7.4). Each entry carries the acting user,
        the role and the date-time (FR-7.3, NFR-3.6). A status entry carries its
        `reason` (FR-6.6); the status entry that resolved the request carries the
        `resolution` recorded with it (FR-6.5, FR-7.5); an assignment entry
        carries `fromAssigneeId` and `toAssigneeId` (FR-5.4).

        Authorised exactly as GET /requests/{id}: staff see every entry; a
        Requester sees created, status and detail entries of their own request,
        with the staff user's identifier withheld. On a security-category request
        a Requester receives no body or reason at all and only the statuses
        FR-3.5 permits (FR-1.5). Staff without the Security Officer role receive
        403 for a security-category request (AC-NFR-4.4). Which entry types a
        Requester may see is not stated in DB-01 or DEC-012; the narrower reading
        is implemented and recorded as an open question.

        There is no operation that alters or deletes an entry (FR-6.7).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The history this caller may see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestHistory' }
        '400':
          description: The identifier is malformed (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The role may not read requests, or the staff member may not view this request (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such request, or a Requester asking for another user's request (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/{id}/comments:
    post:
      tags: [requests]
      operationId: addComment
      summary: Add a comment to a request
      description: |
        FR-7.1. Operation `request:comment` (Technician, Coordinator, Manager,
        Security Officer), and the actor must be authorised for the request's
        category; only a Security Officer may act on a security-category request.
        The comment is a history entry that produces the next request version
        (DB-01), written in one unit of work with that version change (DEC-016).
        `If-Match` is not required (DEC-015 §1); `Idempotency-Key` is. The
        `ETag` of the response is the new version.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCommand' }
      responses:
        '201': { $ref: '#/components/responses/EntryCreated' }
        '400': { $ref: '#/components/responses/EntryInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EntryForbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/EntryConflict' }
        '422': { $ref: '#/components/responses/EntryKeyReused' }
  /requests/{id}/actions:
    post:
      tags: [requests]
      operationId: addAction
      summary: Record an action taken on a request
      description: |
        FR-7.2. Same operation, authorisation, versioning and idempotency as
        `POST /requests/{id}/comments`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCommand' }
      responses:
        '201': { $ref: '#/components/responses/EntryCreated' }
        '400': { $ref: '#/components/responses/EntryInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EntryForbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/EntryConflict' }
        '422': { $ref: '#/components/responses/EntryKeyReused' }
  /requests/{id}/details:
    post:
      tags: [requests]
      operationId: addDetail
      summary: Add optional detail to a request
      description: |
        FR-2.4. Operation `request:add-detail` (Requester). Only the requester who
        owns the request may add detail; another Requester receives the 404 of a
        missing identifier (FR-3.6). The detail is stored with the date, time and
        acting user. Versioning and idempotency are as for comments.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryCommand' }
      responses:
        '201': { $ref: '#/components/responses/EntryCreated' }
        '400': { $ref: '#/components/responses/EntryInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EntryForbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/EntryConflict' }
        '422': { $ref: '#/components/responses/EntryKeyReused' }
  /me/notifications:
    get:
      tags: [notifications]
      operationId: listMyNotifications
      summary: The caller's own in-application notifications, newest first
      description: |
        FR-3.4. Written after a status change commits (DEC-011), read from the
        store, so a notification is available on the requester's next session.
        The recipient is always the authenticated user. A notification identifies
        the request by reference and the kind of change; `displayStatus` is the
        status the recipient may be shown (FR-3.5), and no description, comment,
        action or reason is carried (FR-1.5). At most 50 are returned; they are
        deleted 30 days after creation (DEC-017).
      responses:
        '200':
          description: The caller's notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List active users
      description: |
        DEC-015 Addendum A, A2. Roles: Coordinator, Manager, Administrator
        (`user:list`). Returns `id`, `displayName` and `roles`; the e-mail
        address is returned to an Administrator only (CON-007). Only active
        accounts are listed. Traces to: FR-5.1, FR-1.4.
      parameters:
        - name: role
          in: query
          required: false
          description: Restrict to users holding this FR-1.2 role.
          schema: { $ref: '#/components/schemas/Role' }
        - name: categoryId
          in: query
          required: false
          description: Restrict to users authorised for this category (FR-4.6).
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      responses:
        '200':
          description: The matching users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSummary' }
        '400':
          description: role is not an FR-1.2 role, categoryId is malformed, or an unknown query parameter (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user account
      description: |
        DEC-015 Addendum A, A3. Administrator only (`user:administer`). The
        Administrator supplies the initial password in the body; it is hashed
        with the password hasher (DEC-018 §2) and is never logged or returned.
        A body without a role is refused with the message "A role is required"
        (AC-FR-1.2). Traces to: FR-1.2, FR-1.4, NFR-3.1.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserCommand' }
      responses:
        '201':
          description: The account was created.
          headers:
            Location:
              description: The new user, /api/v1/users/{id}.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '400':
          description: A field is missing (the message names it), a role is missing or not an FR-1.2 role, Idempotency-Key is missing (IDEMPOTENCY_KEY_REQUIRED), or the body is not valid (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: An account with that e-mail exists (CONFLICT).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/{id}/roles:
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Replace a user's roles
      description: |
        DEC-015 Addendum A, A4. Administrator only (`user:administer`). The
        list replaces the user's roles; it must hold at least one FR-1.2 role.
        Takes effect at the user's next request (DEC-018 §3). Traces to: FR-1.4.
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolesCommand' }
      responses:
        '200':
          description: The roles now held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoles' }
        '400':
          description: Malformed id, no role ("A role is required"), a value outside FR-1.2, or Idempotency-Key missing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such user (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/{id}/revocation:
    post:
      tags: [users]
      operationId: revokeUser
      summary: Revoke a user's access
      description: |
        DEC-015 Addendum A, A5. Administrator only (`user:administer`). Sets
        status `revoked` and `revokedAt` and increments `sessionEpoch`, so the
        account can no longer authenticate and every existing session ends at
        the next request (AC-FR-1.4, DEC-018 §3). Idempotent: a repeat returns
        the original 201 and body with `Idempotent-Replayed: true` (DEC-015 §3) and
        does not change the epoch again.
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Access was revoked by this request, or was already revoked (a repeat; then with Idempotent-Replayed true).
          headers:
            Idempotent-Replayed:
              description: Present, with the value true, only on a repeat.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revocation' }
        '400':
          description: Malformed id, or Idempotency-Key missing (IDEMPOTENCY_KEY_REQUIRED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such user (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /reports/summary:
    get:
      tags: [reports]
      operationId: getReportSummary
      summary: Management view
      description: |
        DEC-015 Addendum A, A6. Operation `report:read`. Counts by status (all
        seven FR-6.1 statuses, summing to `total`) and by category (deactivated
        categories included), and the requests that are overdue (FR-8.3). The
        filter is a submission date range and a category; counts include only
        requests matching both (FR-8.5). Security-category requests are
        counted; no element carries a description, comment or action (FR-8.6).
        Aggregated on `requests`, not `reportingCounts` (OI-14).
      parameters:
        - name: from
          in: query
          required: false
          description: Earliest submission time, inclusive. ISO 8601 date or timestamp.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Latest submission time, inclusive. A date alone includes that whole day (UTC).
          schema: { type: string }
        - name: categoryId
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400':
          description: A bad date, from later than to, a malformed categoryId, or an unknown query parameter (INVALID_REQUEST).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /categories/{id}/target:
    put:
      tags: [categories]
      operationId: setCategoryTarget
      summary: Set a category's target resolution time
      description: |
        DEC-015 Addendum A, A7. Manager only (`category:set-target`). The value
        is stored and read by the overdue calculation (AC-FR-8.4). FR-8.4 is
        Proposed (OI-02).
      parameters:
        - name: id
          in: path
          required: true
          description: Category identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTargetCommand' }
      responses:
        '200':
          description: The stored target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryTarget' }
        '400':
          description: Malformed id, targetResolutionHours missing or below 1, or Idempotency-Key missing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such category (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /categories/{id}/deactivation:
    post:
      tags: [categories]
      operationId: deactivateCategory
      summary: Deactivate a category
      description: |
        DEC-015 Addendum A, A8. Administrator only (`category:administer`).
        Sets `active` to false; the category is no longer offered for
        submission (AC-FR-9.1) and requests already recorded against it keep it
        and stay in the category counts (FR-9.2). Idempotent: a repeat returns
        the original 201 and body with `Idempotent-Replayed: true` (DEC-015 §3). FR-9.1 is Proposed (OI-03).
      parameters:
        - name: id
          in: path
          required: true
          description: Category identifier (MongoDB ObjectId).
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The category was deactivated by this request, or was already inactive (a repeat; then with Idempotent-Replayed true).
          headers:
            Idempotent-Replayed:
              description: Present, with the value true, only on a repeat.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryDeactivation' }
        '400':
          description: Malformed id, or Idempotency-Key missing (IDEMPOTENCY_KEY_REQUIRED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No authenticated actor (UNAUTHENTICATED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: The role may not perform this operation (FORBIDDEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such category (NOT_FOUND).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: |
        The session establishes `req.actor` server-side (DEC-018). Identity is
        never taken from a header, query parameter or request body (review
        comment R-06); an identity-shaped header is refused with 403. The value
        is opaque; only its SHA-256 is stored. A session is refused once 30
        minutes have elapsed since its recorded last activity, which is refreshed
        at most once per 60 seconds, so it expires between 29 and 30 minutes
        after the last request (NFR-3.4).
  schemas:
    Health:
      type: object
      required: [application, database, release]
      properties:
        application: { type: string, enum: [up] }
        database: { type: string, enum: [up, down] }
        release:
          type: string
          description: The commit the running process was started from (RELEASE_COMMIT, else the checkout's HEAD), or `unknown`.
          pattern: '^([0-9a-f]{7,40}|unknown)$'
    LoginCommand:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, format: password }
    SessionUser:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string }
        displayName: { type: string }
        roles:
          type: array
          minItems: 1
          items:
            type: string
            description: The controlled role set (FR-1.2).
            enum: [Requester, Technician, Coordinator, Manager, Security Officer, Administrator]
    Status:
      type: string
      description: The controlled status set (FR-6.1).
      enum: [Received, Assigned, In Progress, On Hold, Resolved, Closed, Rejected]
    RequestView:
      type: object
      additionalProperties: false
      required: [id, reference, status, version, categoryId, submittedAt, assigneeId, location, permittedTransitions]
      properties:
        id: { type: string }
        reference: { type: string, pattern: '^CC-\d{4}-\d{6}$' }
        status: { $ref: '#/components/schemas/Status' }
        version: { type: integer, minimum: 0, description: The current version; also returned as the ETag. }
        categoryId: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        assigneeId: { type: string, nullable: true, description: The current owner; null when unassigned. }
        location: { type: string, nullable: true }
        description:
          type: string
          nullable: true
          description: Conditional (FR-1.5). On a security-category request, only for a Security Officer.
        resolution:
          type: object
          additionalProperties: false
          description: Conditional (FR-1.5, AC-FR-7.5), as description.
          properties:
            summary: { type: string, nullable: true }
            recordedAt: { type: string, format: date-time, nullable: true }
        closureReason:
          type: string
          nullable: true
          description: Conditional (FR-1.5), as description. The reason recorded at close or reject (FR-6.6).
        submittedById: { type: string, nullable: true, description: Conditional, staff only. }
        requesterId: { type: string, nullable: true, description: Conditional, staff only. }
        permittedTransitions:
          type: array
          description: The moves this caller may attempt on the transition resource now (TD-003).
          items: { $ref: '#/components/schemas/PermittedTransition' }
    PermittedTransition:
      type: object
      additionalProperties: false
      required: [toStatus, requiresReason, requiresResolution]
      properties:
        toStatus: { $ref: '#/components/schemas/Status' }
        requiresReason: { type: boolean, description: A recorded reason is required (FR-6.6). }
        requiresResolution: { type: boolean, description: Resolution information is required first (FR-6.5). }
    SubmissionCommand:
      type: object
      additionalProperties: false
      required: [categoryId, location, description]
      properties:
        categoryId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: An active category of the caller's campus (FR-2.3).
        location: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 5000 }
    SubmissionResult:
      type: object
      additionalProperties: false
      required: [id, reference, status, version, submittedAt]
      properties:
        id: { type: string }
        reference: { type: string, pattern: '^CC-\d{4}-\d{6}$', description: Unique and unchanging for the life of the request (FR-2.6). }
        status: { $ref: '#/components/schemas/Status' }
        version: { type: integer, minimum: 1 }
        submittedAt: { type: string, format: date-time }
    Category:
      type: object
      additionalProperties: false
      required: [id, code, name, isSecurity]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        isSecurity: { type: boolean }
    TransitionCommand:
      type: object
      required: [toStatus]
      properties:
        toStatus:
          $ref: '#/components/schemas/Status'
        reason:
          type: string
          maxLength: 1000
          description: Required when toStatus is Closed or Rejected (FR-6.6). Recorded as closure.reason and as the history entry body.
        resolution:
          type: string
          maxLength: 2000
          description: Resolution information for In Progress → Resolved (FR-6.5). Recorded as resolution.summary.
    TransitionResult:
      type: object
      required: [requestId, fromStatus, toStatus, occurredAt, version, historyId]
      properties:
        requestId: { type: string }
        fromStatus: { $ref: '#/components/schemas/Status' }
        toStatus: { $ref: '#/components/schemas/Status' }
        occurredAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: The new version; also returned as the ETag. }
        historyId: { type: string, description: The requestHistory entry written (FR-6.3). }
    RequestListItem:
      type: object
      additionalProperties: false
      required: [id, reference, status, categoryId, location, submittedAt, assigneeId]
      properties:
        id: { type: string }
        reference: { type: string, pattern: '^CC-\d{4}-\d{6}$' }
        status: { $ref: '#/components/schemas/Status' }
        categoryId: { type: string }
        location: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        assigneeId: { type: [string, 'null'] }
    RequestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RequestListItem' }
        nextCursor: { type: [string, 'null'], description: Null on the last page. }
    SearchCommand:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/Status' }
        categoryId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
        assigneeId: { type: string, pattern: '^([0-9a-fA-F]{24}|none)$' }
        from: { type: string }
        to: { type: string }
        sort: { type: string, enum: [-submittedAt, submittedAt, status, -status, categoryId, -categoryId] }
        cursor: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100 }
    AssignmentCommand:
      type: object
      additionalProperties: false
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: The user to become the owner. The actor's own id is an accept (FR-5.2).
    AssignmentResult:
      type: object
      required: [requestId, action, fromAssigneeId, toAssigneeId, status, occurredAt, version, historyId]
      properties:
        requestId: { type: string }
        action: { type: string, enum: [assign, accept, reassign] }
        fromAssigneeId: { type: string, nullable: true, description: The previous owner; null for a first assignment (FR-5.5). }
        toAssigneeId: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        occurredAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: The new version; also returned as the ETag. }
        historyId: { type: string, description: The requestHistory entry written (FR-5.4). }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [IDEMPOTENCY_KEY_REQUIRED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND,
                 PRECONDITION_FAILED, INVALID_TRANSITION, IDEMPOTENCY_CONFLICT,
                 PRECONDITION_REQUIRED, INVALID_REQUEST, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE,
                 INTERNAL_ERROR, ASSIGNMENT_REFUSED, WRITE_CONFLICT, CONFLICT]
        instance: { type: string }
    EntryCommand:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000, description: The comment, action or detail text. }
    EntryResult:
      type: object
      required: [requestId, historyId, changeType, requestVersion, occurredAt, version]
      properties:
        requestId: { type: string }
        historyId: { type: string }
        changeType: { type: string, enum: [comment, action, detail] }
        requestVersion: { type: integer, minimum: 1, description: The request version this entry produced (DB-01). }
        occurredAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: The new request version; also returned as the ETag. }
    HistoryEntry:
      type: object
      required: [id, requestVersion, changeType, occurredAt, actorRole, actorId]
      properties:
        id: { type: string }
        requestVersion: { type: integer, minimum: 1 }
        changeType: { type: string, enum: [created, status, assignment, comment, action, detail, resolution] }
        occurredAt: { type: string, format: date-time }
        actorId: { type: [string, 'null'], description: The acting user; withheld (null) from a Requester for entries made by staff. }
        actorRole: { type: string, description: The role the actor held when acting (FR-1.2). }
        fromStatus: { type: [string, 'null'], description: Present on created and status entries. A Requester sees FR-3.5 mapped values on a security-category request. }
        toStatus: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: On a status entry (FR-6.6). Never sent to a Requester for a security-category request. }
        resolution: { type: [string, 'null'], description: On the status entry that resolved the request (FR-6.5, FR-7.5). Staff only. }
        fromAssigneeId: { type: [string, 'null'], description: On an assignment entry (FR-5.4). Staff only. }
        toAssigneeId: { type: [string, 'null'] }
        body: { type: [string, 'null'], description: On comment, action, detail and resolution entries. Comment, action and resolution entries are staff only; a detail body is never sent to a Requester for a security-category request. }
    RequestHistory:
      type: object
      required: [requestId, entries]
      properties:
        requestId: { type: string }
        entries:
          type: array
          description: Ascending requestVersion.
          items: { $ref: '#/components/schemas/HistoryEntry' }
    Notification:
      type: object
      additionalProperties: false
      required: [id, requestId, requestReference, kind, displayStatus, read, createdAt]
      properties:
        id: { type: string }
        requestId: { type: string }
        requestReference: { type: string, pattern: '^CC-\d{4}-\d{6}$' }
        kind: { type: string, enum: [accepted, rejected, updated, completed] }
        displayStatus: { $ref: '#/components/schemas/Status' }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
    Role:
      type: string
      description: The controlled role set (FR-1.2).
      enum: [Requester, Technician, Coordinator, Manager, Security Officer, Administrator]
    UserSummary:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        email: { type: string, description: Returned to an Administrator only (CON-007). }
    CreateUserCommand:
      type: object
      additionalProperties: false
      required: [email, displayName, password, roles]
      properties:
        email: { type: string }
        displayName: { type: string, maxLength: 100 }
        password: { type: string, format: password, description: Hashed on receipt; never returned or logged. }
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Role' } }
        categoryAuthorisations: { type: array, items: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
    CreatedUser:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    SetRolesCommand:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Role' } }
    UserRoles:
      type: object
      required: [id, roles]
      properties:
        id: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    Revocation:
      type: object
      required: [id, status, revokedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [revoked] }
        revokedAt: { type: [string, 'null'], format: date-time }
    ReportSummary:
      type: object
      required: [byStatus, byCategory, overdue, total]
      properties:
        byStatus:
          type: object
          description: A count for every FR-6.1 status; the counts sum to total.
          additionalProperties: { type: integer, minimum: 0 }
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, code, name, active, count]
            properties:
              categoryId: { type: string }
              code: { type: [string, 'null'] }
              name: { type: [string, 'null'] }
              active: { type: boolean }
              count: { type: integer, minimum: 0 }
        overdue:
          type: object
          required: [count, requests]
          properties:
            count: { type: integer, minimum: 0 }
            requests:
              type: array
              items:
                type: object
                required: [id, reference, categoryId, status, openHours]
                properties:
                  id: { type: string }
                  reference: { type: string }
                  categoryId: { type: string }
                  status: { $ref: '#/components/schemas/Status' }
                  openHours: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    SetTargetCommand:
      type: object
      additionalProperties: false
      required: [targetResolutionHours]
      properties:
        targetResolutionHours: { type: number, minimum: 1 }
    CategoryTarget:
      type: object
      required: [id, targetResolutionHours]
      properties:
        id: { type: string }
        targetResolutionHours: { type: number, minimum: 1 }
    CategoryDeactivation:
      type: object
      required: [id, active]
      properties:
        id: { type: string }
        active: { type: boolean, enum: [false] }

  parameters:
    RequestId:
      name: id
      in: path
      required: true
      description: Request identifier (MongoDB ObjectId).
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key generated per logical user action and reused unchanged on every
        retry (UUID v4 recommended, at most 64 characters). Missing or blank
        returns 400. Reused with a different body returns 422. Reused with the
        same body returns the original result with its original status code, header
        `Idempotent-Replayed: true`, and writes nothing (DEC-015 §3).
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Unauthenticated:
      description: No authenticated actor (UNAUTHENTICATED).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryCreated:
      description: The entry was appended; the request is at the new version. A replay returns this status and body with Idempotent-Replayed true.
      headers:
        ETag:
          description: The new version, e.g. "v4".
          schema: { type: string }
        Idempotent-Replayed:
          description: Present, with the value true, only on a replay.
          schema: { type: string, enum: ['true'] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EntryResult' }
    EntryInvalid:
      description: |
        Idempotency-Key missing (IDEMPOTENCY_KEY_REQUIRED); or the identifier,
        the key length or the body is invalid: `body` missing, blank, over 5000
        characters, or an unknown field (INVALID_REQUEST).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryForbidden:
      description: |
        The role may not perform the operation (route guard), or the actor may
        not act on this request: not authorised for its category, or a
        security-category request without the Security Officer role (FORBIDDEN).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryNotFound:
      description: No such request, or a Requester naming another user's request (NOT_FOUND).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryConflict:
      description: Another write kept changing the request; retries were exhausted (WRITE_CONFLICT). Retry the action.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EntryKeyReused:
      description: The Idempotency-Key was used with a different body (IDEMPOTENCY_CONFLICT).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }